<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sport 20-10-5">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="sport-20-10-5-icon.png">
<title>Programme 20-10-5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : trois niveaux d'énergie, chacun sa couleur (vert 20, ambre 10, rose 5).
   Chiffres condensés façon tableau de salle de sport, texte en Inter. */
:root{
  --bg:#F1F4F8;--surface:#FFFFFF;--surface2:#E6EBF2;--ink:#0F1823;--muted:#566475;--line:#D3DBE5;
  --t20:#0B7A69;--t10:#A85F0A;--t5:#B83A5B;--on:#FFFFFF;--rest:#6A7F96;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C121A;--surface:#151E29;--surface2:#1F2B39;--ink:#E9EFF6;--muted:#97A5B6;--line:#263444;
    --t20:#3FCFB6;--t10:#F2AE55;--t5:#F58AA3;--on:#07100E;--rest:#8EA3BA;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C121A;--surface:#151E29;--surface2:#1F2B39;--ink:#E9EFF6;--muted:#97A5B6;--line:#263444;
  --t20:#3FCFB6;--t10:#F2AE55;--t5:#F58AA3;--on:#07100E;--rest:#8EA3BA;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body[data-tier="20"]{--tc:var(--t20)}
body[data-tier="10"]{--tc:var(--t10)}
body[data-tier="5"]{--tc:var(--t5)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tc,var(--ink));outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}

.wrap{max-width:560px;margin:0 auto;padding-block:20px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:700 44px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin-top:6px;text-wrap:balance}
.lede{color:var(--muted);margin-top:8px;max-width:42ch}

/* Sélecteur de niveau */
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.pick{--c:var(--t20);appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  min-width:0;padding:12px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.pick[data-t="10"]{--c:var(--t10)}
.pick[data-t="5"]{--c:var(--t5)}
.pick .num{font:700 54px/.9 var(--f-display);color:var(--c)}
.pick .unit{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pick .l1{font-weight:600;font-size:13px;margin-top:8px;line-height:1.25}
.pick .l2{font-size:12px;color:var(--muted);line-height:1.25}
.pick[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.pick[aria-pressed="true"] .num,.pick[aria-pressed="true"] .unit,.pick[aria-pressed="true"] .l2{color:var(--on)}
.pick[aria-pressed="true"] .unit,.pick[aria-pressed="true"] .l2{opacity:.85}

/* Panneau de séance */
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:18px}
.p-head .eyebrow{color:var(--tc)}
.p-head h2{font:700 32px/1.05 var(--f-display);text-transform:uppercase;margin-top:6px;text-wrap:balance}
.p-lede{color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips li{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface2);border-radius:12px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;min-height:44px;padding:6px 8px;font-weight:500;font-size:14px}
.seg button b{font:700 18px/1 var(--f-display);margin-right:4px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--tc);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:-8px}
.go{appearance:none;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--tc);color:var(--on);
  font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.go span{font:700 20px/1 var(--f-display);padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.22);font-variant-numeric:tabular-nums}
body:is([data-tier]) .go:active{transform:scale(.985)}
.ghost{appearance:none;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:36px;margin-top:-10px}
.ghost:disabled{text-decoration:none;color:var(--tc);cursor:default}

.bar{display:flex;gap:3px;height:14px}
.bar i{display:block;border-radius:4px;background:var(--tc);min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block}
.legend span{font-variant-numeric:tabular-nums}

.phase{border-top:1px solid var(--line);padding-top:14px}
.phase header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px}
.phase h3{font:600 12px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
.phase header span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.exs{margin-top:6px}
.ex{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.ex + .ex{border-top:1px dashed var(--line)}
.ix{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;
  font:700 15px/1 var(--f-display);color:var(--tc);margin-top:1px}
.ex-main{flex:1;min-width:0}
.ex-main b{font-weight:600;display:block}
.ex-main small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:1px}
.ex-d{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.notes{display:grid;gap:6px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Semaine */
.week{margin-top:24px}
.week h2{font:700 24px/1 var(--f-display);text-transform:uppercase}
.wk-sum{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.dl{font-size:12px;font-weight:600;color:var(--muted)}
.dot{--c:var(--t20);width:100%;max-width:46px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
  border:1.5px dashed var(--line);font:700 17px/1 var(--f-display);color:var(--on)}
.dot[data-t="10"]{--c:var(--t10)}
.dot[data-t="5"]{--c:var(--t5)}
.dot[data-t]{background:var(--c);border:0}
.day.today .dl{color:var(--ink)}
.day.today .dot:not([data-t]){border:2px solid var(--ink)}
.day.future{opacity:.5}
.fine{font-size:12px;color:var(--muted);margin-top:10px}
.rule{margin-top:24px;padding:14px 16px;border-radius:14px;background:var(--surface2);font-size:14px}
.rule b{font-weight:600}

/* Minuteur */
.timer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.t-run,.t-done{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;max-width:560px;width:100%;margin:0 auto}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-tools{display:flex;gap:8px}
.mini{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;padding:4px 14px;font-size:14px;font-weight:500}
.t-prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.t-prog i{display:block;height:100%;width:0;background:var(--tc)}
.t-body{--rc:var(--tc);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-block:8px}
.t-body[data-kind="rest"]{--rc:var(--rest)}
.t-kind{font:600 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.ring{position:relative;width:min(72vw,300px);aspect-ratio:1/1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--surface2)}
.ring .arc{stroke:var(--rc)}
.clock{position:absolute;inset:0;display:grid;place-content:center;font:700 clamp(64px,22vw,96px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.t-name{font:700 32px/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance}
.t-cue{color:var(--muted);max-width:34ch;min-height:1.4em}
.t-next{font-size:14px;color:var(--muted)}
.t-next b{color:var(--ink);font-weight:600}
.t-ctrl{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px}
.btn1,.btn2{appearance:none;min-height:58px;border-radius:14px;font-weight:600;font-size:16px}
.btn1{border:0;background:var(--tc);color:var(--on)}
.btn2{border:1.5px solid var(--line);background:var(--surface)}
.t-done{align-items:center;justify-content:center;text-align:center}
.t-done .big{font:700 clamp(56px,20vw,88px)/.95 var(--f-display);text-transform:uppercase;color:var(--tc)}
.t-done p{color:var(--muted)}
.t-done .btn1{width:100%;margin-top:10px}
@media (prefers-reduced-motion:no-preference){
  .ring .arc{transition:stroke-dashoffset .25s linear}
  .t-prog i{transition:width .25s linear}
}

/* Réglages de la page autonome (hors Claude) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Sport à la maison</p>
    <h1>Programme 20-10-5</h1>
    <p class="lede">Une séance pour chaque niveau d’énergie. Choisis celle du jour, lance le minuteur.</p>
  </header>
  <div class="picker" id="picker" role="group" aria-label="Niveau d’énergie"></div>
  <section class="panel" id="panel"></section>
  <section class="week" id="week"></section>
  <aside class="rule"><b>La règle :</b> quand l’énergie baisse, change de niveau au lieu de sauter la séance. Cinq minutes valent mieux que zéro.</aside>
</main>

<div class="timer" id="timer" hidden role="dialog" aria-label="Séance en cours">
  <div class="t-run" id="tRun">
    <div class="t-top">
      <span class="t-count" id="tCount"></span>
      <div class="t-tools">
        <button class="mini" id="tSound" type="button" aria-pressed="true">Son</button>
        <button class="mini" id="tQuit" type="button">Quitter</button>
      </div>
    </div>
    <div class="t-prog"><i id="tProg"></i></div>
    <div class="t-body" id="tBody" data-kind="warm">
      <p class="t-kind" id="tKind"></p>
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="arc" id="tArc" cx="60" cy="60" r="52"/></svg>
        <div class="clock" id="tClock">0:00</div>
      </div>
      <h2 class="t-name" id="tName" aria-live="polite"></h2>
      <p class="t-cue" id="tCue"></p>
      <p class="t-next" id="tNext"></p>
    </div>
    <div class="t-ctrl">
      <button class="btn2" id="tBack" type="button">Précédent</button>
      <button class="btn1" id="tPause" type="button">Pause</button>
      <button class="btn2" id="tSkip" type="button">Passer</button>
    </div>
  </div>
  <div class="t-done" id="tDone" hidden>
    <p class="t-kind" style="color:var(--tc)">Séance terminée</p>
    <p class="big" id="dBig">Bravo</p>
    <p id="dText"></p>
    <button class="btn1" id="dBack" type="button">Retour</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- Données ---------- */
  var WARM_A = {id:'warm',name:'Échauffement',kind:'warm',op:.35,items:[
    {n:'Rotations d’épaules et de hanches',c:'Grands cercles, sans forcer.',d:40},
    {n:'Squats poids du corps',c:'Descends lentement, remonte en poussant sur les talons.',d:40},
    {n:'Genoux hauts sur place',c:'Rythme tranquille, les bras accompagnent.',d:40}]};
  var WARM_B = {id:'warm',name:'Échauffement',kind:'warm',op:.35,items:[
    {n:'Cercles de bras',c:'Petits puis grands, dans les deux sens.',d:40},
    {n:'Rotations du buste',c:'Pieds ancrés, bras relâchés.',d:40},
    {n:'Pompes inclinées lentes',c:'Mains sur un plan de travail, descente contrôlée.',d:40}]};

  var TIERS = {
    '20': {
      num:20,eyebrow:'Séance complète · 20 min',title:'Haltères, tout le corps',l1:'Motivé',l2:'Télétravail',
      lede:'Un circuit de quatre exercices, un finisher de gainage, puis des étirements. Alterne A et B.',
      gear:['2 haltères','Un peu de place au sol'],
      notes:['Option tapis : remplace le finisher par 4 min de marche inclinée.','Quand les dernières répétitions restent faciles, passe à des haltères plus lourdes.'],
      variants:{
        A:{label:'Bas du corps',title:'Bas du corps + gainage',phases:[
          WARM_A,
          {id:'circuit',name:'Circuit',kind:'work',op:1,rounds:3,work:40,rest:20,items:[
            {n:'Squat gobelet',c:'Haltère contre la poitrine, descends cuisses parallèles, dos droit.'},
            {n:'Soulevé de terre roumain',c:'Haltères le long des jambes, hanches en arrière, dos plat.'},
            {n:'Fente arrière alternée',c:'Un grand pas en arrière, genou avant au-dessus de la cheville.'},
            {n:'Pont fessier',c:'Dos au sol, haltère sur les hanches, serre les fessiers en haut.'}]},
          {id:'finish',name:'Gainage',kind:'work',op:.65,rounds:2,work:40,rest:20,items:[
            {n:'Planche',c:'Coudes sous les épaules, corps aligné, ventre serré.'},
            {n:'Dead bug',c:'Dos plaqué au sol, bras et jambe opposés s’allongent.'}]},
          {id:'cool',name:'Retour au calme',kind:'cool',op:.35,items:[
            {n:'Étirement fléchisseurs de hanche',c:'Fente basse, bassin vers l’avant. 30 s par côté.',d:60},
            {n:'Étirement ischio-jambiers',c:'Jambe tendue devant, dos droit. 30 s par côté.',d:60}]}
        ]},
        B:{label:'Haut du corps',title:'Haut du corps + gainage',phases:[
          WARM_B,
          {id:'circuit',name:'Circuit',kind:'work',op:1,rounds:3,work:40,rest:20,items:[
            {n:'Rowing buste penché',c:'Dos plat, tire les coudes vers les hanches.'},
            {n:'Développé épaules',c:'Haltères à hauteur d’épaules, pousse sans cambrer.'},
            {n:'Pompes',c:'Corps gainé. Sur les genoux ou mains surélevées si besoin.'},
            {n:'Curl marteau',c:'Coudes collés, paumes face à face, monte sans balancer.'}]},
          {id:'finish',name:'Gainage',kind:'work',op:.65,rounds:2,work:40,rest:20,items:[
            {n:'Planche',c:'Coudes sous les épaules, corps aligné, ventre serré.'},
            {n:'Superman',c:'À plat ventre, lève bras et jambes, tiens 2 secondes.'}]},
          {id:'cool',name:'Retour au calme',kind:'cool',op:.35,items:[
            {n:'Étirement des pectoraux au mur',c:'Bras contre le mur, tourne le buste. 30 s par côté.',d:60},
            {n:'Posture de l’enfant',c:'Fesses sur les talons, bras loin devant, respire.',d:60}]}
        ]}
      }
    },
    '10': {
      num:10,eyebrow:'Séance express · 10 min',title:'Tout le corps, sans forcer',l1:'Retour du site',l2:'Journée finie',
      lede:'Trois exercices en circuit, à intensité modérée. Garde trois répétitions en réserve, pas d’échec.',
      gear:['2 haltères légères','Un plan de travail'],
      notes:['Prends des haltères plus légères que d’habitude.'],
      phases:[
        {id:'warm',name:'Mobilité',kind:'warm',op:.35,items:[
          {n:'Cercles de hanches et rotations du buste',c:'Debout, laisse la journée se défaire.',d:60}]},
        {id:'circuit',name:'Circuit',kind:'work',op:1,rounds:3,work:40,rest:20,items:[
          {n:'Squat gobelet léger',c:'Haltère légère ou poids du corps, descente contrôlée.'},
          {n:'Pompes inclinées',c:'Mains sur le plan de travail, corps droit.'},
          {n:'Rowing buste penché',c:'Dos plat, tire doucement les coudes vers les hanches.'}]}
      ]
    },
    '5': {
      num:5,eyebrow:'Minimum vital · 5 min',title:'Sans matériel, sans te changer',l1:'Trop crevé',l2:'Minimum vital',
      lede:'Pas de matériel, pas de tenue. Tu bouges, tu gardes le rythme, tu respires.',
      gear:['Aucun matériel','Un mur ou une table'],
      notes:['Ça compte comme une vraie séance.'],
      phases:[
        {id:'warm',name:'Mobilité',kind:'warm',op:.35,items:[
          {n:'Mobilité douce',c:'Cercles de hanches, rotation du buste, étire-toi.',d:60}]},
        {id:'main',name:'Renforcement',kind:'flow',op:1,items:[
          {n:'Squats lents',c:'Trois secondes pour descendre, poids du corps.',d:60},
          {n:'Pompes inclinées',c:'Mains sur une table ou au mur, par séries courtes.',d:60},
          {n:'Planche',c:'Sur les genoux si besoin, en deux fois si ça tire.',d:60}]},
        {id:'cool',name:'Respiration',kind:'cool',op:.35,items:[
          {n:'Respiration lente',c:'Inspire 4 secondes, expire 6 secondes.',d:60}]}
      ]
    }
  };
  var ORDER = ['20','10','5'];
  var KIND_LABEL = {warm:'Échauffement',cool:'Retour au calme',work:'Effort',rest:'Repos',flow:'En continu'};
  var DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  var LETTERS = ['L','M','M','J','V','S','D'];

  /* ---------- Journal (local à l’appareil) ---------- */
  var LOGKEY = 'programme-20-10-5-log';
  var memLog = null;
  function loadLog(){
    if(memLog) return memLog;
    try{ memLog = JSON.parse(localStorage.getItem(LOGKEY) || '{}') || {}; }catch(e){ memLog = {}; }
    return memLog;
  }
  function saveLog(){ try{ localStorage.setItem(LOGKEY, JSON.stringify(memLog)); }catch(e){} }
  function dateKey(d){
    var m = d.getMonth()+1, j = d.getDate();
    return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j;
  }
  function addLog(tag){
    var log = loadLog(), k = dateKey(new Date());
    (log[k] = log[k] || []).push(tag);
    saveLog();
  }
  function lastVariant(){
    var log = loadLog(), keys = Object.keys(log).sort();
    for(var i=keys.length-1;i>=0;i--){
      var e = log[keys[i]];
      for(var j=e.length-1;j>=0;j--){
        var t = String(e[j]);
        if(t.indexOf('20')===0 && t.length>2) return t.charAt(2);
      }
    }
    return null;
  }

  /* ---------- État ---------- */
  var state = {tier:'20', variant: lastVariant()==='A' ? 'B' : 'A'};
  try{ var h0 = (location.hash||'').replace('#',''); if(TIERS[h0]) state.tier = h0; }catch(e){}

  function current(){
    var T = TIERS[state.tier];
    return T.variants ? T.variants[state.variant] : T;
  }
  function tag(){ return state.tier==='20' ? '20'+state.variant : state.tier; }

  /* ---------- Construction des étapes ---------- */
  function build(phases){
    var steps = [];
    phases.forEach(function(p,pi){
      if(p.work){
        for(var r=1;r<=p.rounds;r++){
          p.items.forEach(function(it){
            steps.push({n:it.n,c:it.c,d:p.work,kind:'work',pi:pi,phase:p.name,round:r,rounds:p.rounds});
            steps.push({n:'Repos',c:'Respire, relâche les bras.',d:p.rest,kind:'rest',pi:pi,phase:p.name,round:r,rounds:p.rounds});
          });
        }
      }else{
        p.items.forEach(function(it){
          steps.push({n:it.n,c:it.c,d:it.d,kind:p.kind,pi:pi,phase:p.name});
        });
      }
    });
    var last = steps[steps.length-1];
    if(last && last.kind==='rest'){ last.n='Souffle final'; last.c='Respire profondément, c’est terminé.'; }
    steps.forEach(function(s,i){ s.next = steps[i+1] ? steps[i+1].n : null; });
    return steps;
  }
  function fmtMin(sec){
    var m = sec/60;
    return (m%1===0 ? m : String(m.toFixed(1)).replace('.',','))+' min';
  }
  function clock(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m+':'+(s<10?'0':'')+s;
  }

  /* ---------- Rendu ---------- */
  function renderPicker(){
    var h = '';
    ORDER.forEach(function(k){
      var T = TIERS[k];
      h += '<button class="pick" type="button" data-t="'+k+'" aria-pressed="'+(k===state.tier)+'">'+
        '<span class="num">'+T.num+'</span><span class="unit">min</span>'+
        '<span class="l1">'+T.l1+'</span><span class="l2">'+T.l2+'</span></button>';
    });
    document.getElementById('picker').innerHTML = h;
  }

  function renderPanel(){
    var T = TIERS[state.tier], V = current(), phases = V.phases;
    var steps = build(phases);
    var total = steps.reduce(function(a,s){ return a+s.d; },0);
    var per = phases.map(function(p,pi){
      return steps.filter(function(s){ return s.pi===pi; }).reduce(function(a,s){ return a+s.d; },0);
    });
    var h = '<div class="p-head"><p class="eyebrow">'+T.eyebrow+'</p><h2>'+(V.title||T.title)+'</h2>'+
      '<p class="p-lede">'+T.lede+'</p><ul class="chips">'+
      T.gear.map(function(g){ return '<li>'+g+'</li>'; }).join('')+'</ul></div>';

    if(T.variants){
      h += '<div class="seg" role="group" aria-label="Variante">';
      ['A','B'].forEach(function(v){
        h += '<button type="button" data-v="'+v+'" aria-pressed="'+(v===state.variant)+'"><b>'+v+'</b> '+T.variants[v].label+'</button>';
      });
      h += '</div><p class="hint">Alterne A et B d’un jour à l’autre.</p>';
    }

    h += '<button class="go" id="go" type="button">Lancer la séance <span>'+clock(total)+'</span></button>'+
      '<button class="ghost" id="mark" type="button">Je l’ai déjà faite</button>';

    h += '<div><div class="bar" aria-hidden="true">'+
      phases.map(function(p,pi){ return '<i style="flex:'+per[pi]+' 1 0;opacity:'+p.op+'"></i>'; }).join('')+
      '</div><ul class="legend">'+
      phases.map(function(p,pi){ return '<li><i style="opacity:'+p.op+'"></i>'+p.name+' <span>'+fmtMin(per[pi])+'</span></li>'; }).join('')+
      '</ul></div>';

    phases.forEach(function(p,pi){
      var meta = p.work ? p.rounds+' tours · '+p.work+' s effort, '+p.rest+' s repos' : fmtMin(per[pi]);
      h += '<section class="phase"><header><h3>'+p.name+'</h3><span>'+meta+'</span></header><ol class="exs">';
      p.items.forEach(function(it,ii){
        h += '<li class="ex">'+(p.work ? '<span class="ix">'+(ii+1)+'</span>' : '')+
          '<div class="ex-main"><b>'+it.n+'</b><small>'+it.c+'</small></div>'+
          (p.work ? '' : '<span class="ex-d">'+(it.d>=60 ? (it.d/60)+' min' : it.d+' s')+'</span>')+'</li>';
      });
      h += '</ol></section>';
    });

    if(T.notes && T.notes.length){
      h += '<div class="notes">'+T.notes.map(function(n){ return '<p>'+n+'</p>'; }).join('')+'</div>';
    }
    document.getElementById('panel').innerHTML = h;
  }

  function renderWeek(){
    var log = loadLog(), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var dow = (now.getDay()+6)%7;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-dow);
    var mins = 0, count = 0, cells = '';
    for(var i=0;i<7;i++){
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+i);
      var e = log[dateKey(d)] || [];
      e.forEach(function(t){ mins += parseInt(t,10)||0; count++; });
      var last = e.length ? parseInt(e[e.length-1],10) : null;
      var cls = 'day'+(d.getTime()===today.getTime()?' today':'')+(d>today?' future':'');
      var label = DAYS[i]+' : '+(last ? e.reduce(function(a,t){ return a+(parseInt(t,10)||0); },0)+' minutes' : 'rien');
      cells += '<li class="'+cls+'" aria-label="'+label+'"><span class="dl">'+LETTERS[i]+'</span>'+
        '<span class="dot"'+(last?' data-t="'+last+'"':'')+'>'+(last?last:'')+'</span></li>';
    }
    document.getElementById('week').innerHTML =
      '<h2>Cette semaine</h2><p class="wk-sum">'+mins+' min · '+count+' séance'+(count>1?'s':'')+'</p>'+
      '<ol class="days">'+cells+'</ol><p class="fine">Le suivi reste enregistré sur cet appareil.</p>';
  }

  function setTier(t){
    state.tier = t;
    document.body.setAttribute('data-tier', t);
    try{ history.replaceState(null,'','#'+t); }catch(e){}
    renderPicker(); renderPanel();
  }

  /* ---------- Son, vibration, écran allumé ---------- */
  var ac = null, soundOn = true, wl = null;
  function ensureAudio(){
    try{
      if(!ac){ var C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
      if(ac && ac.state==='suspended') ac.resume();
    }catch(e){}
  }
  function beep(f,d,v){
    if(!soundOn || !ac) return;
    try{
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(v||0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+d+0.02);
    }catch(e){}
  }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){} }
  function lock(){
    try{ if(navigator.wakeLock){ navigator.wakeLock.request('screen').then(function(s){ wl = s; }).catch(function(){}); } }catch(e){}
  }
  function unlock(){ try{ if(wl){ wl.release(); wl = null; } }catch(e){} }

  /* ---------- Minuteur ---------- */
  var run = null, timerId = null, quitTimer = null;
  var CIRC = 2*Math.PI*52;
  var $ = function(id){ return document.getElementById(id); };
  $('tArc').style.strokeDasharray = CIRC;

  function startRun(){
    var V = current();
    var steps = build(V.phases);
    var cum = [], acc = 0;
    steps.forEach(function(s){ cum.push(acc); acc += s.d*1000; });
    run = {steps:steps,idx:0,rem:0,endAt:0,paused:false,cum:cum,total:acc,tag:tag(),finished:false,lastSec:null};
    ensureAudio(); lock();
    $('timer').hidden = false;
    $('tRun').hidden = false; $('tDone').hidden = true;
    document.body.classList.add('lock');
    $('tPause').textContent = 'Pause';
    goTo(0,true);
    clearInterval(timerId);
    timerId = setInterval(tick,200);
  }

  function goTo(i,silent){
    if(i<0) i = 0;
    if(i>=run.steps.length){ finish(); return; }
    run.idx = i;
    var s = run.steps[i];
    run.rem = s.d*1000;
    run.endAt = Date.now()+run.rem;
    run.lastSec = null;
    paintStep();
    if(!silent){ beep(s.kind==='rest'?523:880,.25,.3); buzz(); }
    tick();
  }

  function paintStep(){
    var s = run.steps[run.idx];
    $('tBody').setAttribute('data-kind', s.kind);
    $('tKind').textContent = KIND_LABEL[s.kind] + (s.rounds ? ' · tour '+s.round+'/'+s.rounds : '');
    $('tName').textContent = s.n;
    $('tCue').textContent = s.c;
    $('tNext').innerHTML = s.next ? 'Ensuite : <b>'+s.next+'</b>' : 'Dernière étape';
    $('tCount').textContent = 'Étape '+(run.idx+1)+' sur '+run.steps.length;
  }

  function tick(){
    if(!run || run.finished) return;
    var s = run.steps[run.idx];
    if(!run.paused){
      run.rem = run.endAt - Date.now();
      if(run.rem <= 0){ goTo(run.idx+1); return; }
    }
    var sec = Math.ceil(run.rem/1000);
    $('tClock').textContent = clock(sec);
    $('tArc').style.strokeDashoffset = CIRC*(1 - run.rem/(s.d*1000));
    var done = run.cum[run.idx] + (s.d*1000 - run.rem);
    $('tProg').style.width = Math.min(100, done/run.total*100)+'%';
    if(!run.paused && sec<=3 && sec>0 && run.lastSec!==sec){ run.lastSec = sec; beep(660,.08,.2); }
  }

  function togglePause(){
    if(!run || run.finished) return;
    if(run.paused){ run.endAt = Date.now()+run.rem; run.paused = false; $('tPause').textContent = 'Pause'; }
    else{ run.rem = run.endAt - Date.now(); run.paused = true; $('tPause').textContent = 'Reprendre'; }
    tick();
  }

  function closeTimer(){
    clearInterval(timerId); timerId = null;
    unlock();
    $('timer').hidden = true;
    document.body.classList.remove('lock');
    run = null;
  }

  function finish(){
    run.finished = true;
    clearInterval(timerId); timerId = null;
    unlock();
    addLog(run.tag);
    var minutes = Math.round(run.total/60000);
    $('dBig').textContent = minutes+' min';
    $('dText').textContent = 'Séance enregistrée dans ta semaine. Bois un verre d’eau.';
    $('tRun').hidden = true; $('tDone').hidden = false;
    [784,988,1175].forEach(function(f,i){ setTimeout(function(){ beep(f,.28,.3); },i*220); });
    buzz();
    renderWeek();
  }

  /* ---------- Événements ---------- */
  $('picker').addEventListener('click',function(e){
    var b = e.target.closest('.pick');
    if(b) setTier(b.getAttribute('data-t'));
  });
  $('panel').addEventListener('click',function(e){
    var v = e.target.closest('[data-v]');
    if(v){ state.variant = v.getAttribute('data-v'); renderPanel(); return; }
    if(e.target.closest('#go')){ startRun(); return; }
    var m = e.target.closest('#mark');
    if(m && !m.disabled){ addLog(tag()); renderWeek(); m.textContent = 'Enregistrée'; m.disabled = true; }
  });
  $('tPause').addEventListener('click',togglePause);
  $('tSkip').addEventListener('click',function(){ if(run && !run.finished) goTo(run.idx+1); });
  $('tBack').addEventListener('click',function(){ if(run && !run.finished) goTo(run.idx-1); });
  $('tSound').addEventListener('click',function(){
    soundOn = !soundOn;
    this.setAttribute('aria-pressed', soundOn);
    this.textContent = soundOn ? 'Son' : 'Muet';
  });
  $('tQuit').addEventListener('click',function(){
    var b = this;
    if(quitTimer){ clearTimeout(quitTimer); quitTimer = null; b.textContent = 'Quitter'; closeTimer(); return; }
    b.textContent = 'Confirmer ?';
    quitTimer = setTimeout(function(){ quitTimer = null; b.textContent = 'Quitter'; },3000);
  });
  $('dBack').addEventListener('click',closeTimer);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && run && !run.finished) lock();
  });
  window.addEventListener('hashchange',function(){
    var h = (location.hash||'').replace('#','');
    if(TIERS[h] && h!==state.tier) setTier(h);
  });

  /* ---------- Démarrage ---------- */
  document.body.setAttribute('data-tier', state.tier);
  renderPicker(); renderPanel(); renderWeek();
})();
</script>
</body>
</html>
